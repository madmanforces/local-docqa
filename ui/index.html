<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폐쇄망 문서 Q&amp;A</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #1d232b; --muted: #6a7380;
    --accent: #2457c5; --accent-weak: #e8eefb; --ok: #1d7a46; --ok-weak: #e6f4ec;
    --warn: #9a5b00; --warn-weak: #fdf3e2; --err: #b3261e;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #1d2128; --line: #2e343d; --text: #e6e9ee; --muted: #9aa3ae;
      --accent: #7aa2ff; --accent-weak: #22304d; --ok: #6fd39b; --ok-weak: #1b3326;
      --warn: #f0b860; --warn-weak: #3a2e1a; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.on { color: var(--ok); background: var(--ok-weak); border-color: transparent; }
  .chip.off { color: var(--err); }
  select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }

  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; }
  aside h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  aside ol { margin: 0 0 20px; padding-left: 18px; font-size: 13px; }
  aside li { margin-bottom: 6px; }
  aside p { font-size: 12px; color: var(--muted); margin: 0; }

  main { overflow: auto; padding: 24px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  form { display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; height: 52px; font: inherit; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-weight: 600; padding: 0 20px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 24px; }
  .examples button {
    font-weight: 400; font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent);
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .q { font-weight: 600; margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
  .badge.ok { color: var(--ok); background: var(--ok-weak); }
  .badge.unknown { color: var(--warn); background: var(--warn-weak); }
  .answer { font-size: 16px; margin: 0 0 12px; }
  .cites h3 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  details { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  summary { cursor: pointer; padding: 8px 12px; font-size: 14px; }
  summary b { color: var(--accent); }
  details pre {
    margin: 0; padding: 10px 12px 12px; white-space: pre-wrap; word-break: keep-all;
    font: 13px/1.7 inherit; font-family: inherit; color: var(--text); border-top: 1px solid var(--line);
    max-height: 240px; overflow: auto;
  }
  mark { background: #ffe58a; color: #1d232b; border-radius: 2px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .retrieved { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--err); }
  .thinking { color: var(--muted); }
  .thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>폐쇄망 문서 Q&amp;A</h1>
  <span class="sub">인터넷 없이, 규정 조문을 근거로 답합니다</span>
  <span class="spacer"></span>
  <label class="sub" for="profile">실행 조건</label>
  <select id="profile"></select>
  <span id="status" class="chip">연결 확인 중</span>
</header>

<aside>
  <h2>검색 대상 규정</h2>
  <ol id="docs"><li class="sub">불러오는 중…</li></ol>
  <h2>이렇게 동작합니다</h2>
  <p>질문과 비슷한 조문 5개를 찾고, 로컬 모델이 그 안에서만 답합니다. 근거가 없으면 지어내지 않고 «모른다»고 답합니다.</p>
</aside>

<main>
  <div class="wrap">
    <form id="f">
      <textarea id="q" placeholder="예: 거제해양관광개발공사 회계 규정에서 자산가액은 원칙적으로 무엇에 따르나요?"></textarea>
      <button id="go" type="submit">질문</button>
    </form>
    <div class="examples" id="examples"></div>
    <div id="out"></div>
  </div>
</main>

<script>
const API = location.port === "8765" ? "" : "http://127.0.0.1:8765";
const EXAMPLES = [
  "건강보험심사평가원 인사규정에서 연가를 시간 단위로 쓰면 누계 몇 시간을 연가 1일로 계산하나요?",
  "여수시도시관리공단 환경미화원 취업규칙에서 업무시간 시작 후 몇 분 이내에 출근하면 지각으로 처리하나요?",
  "한국교육과정평가원 연구윤리 규칙에서 예비조사와 본조사 관련 기록은 몇 년 이상 보관해야 하나요?",
  "거제해양관광개발공사 회계 규정상 직원 법인카드의 1회 사용 한도는 얼마인가요?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function highlight(text, answer) {
  // 답에 나온 숫자·낱말(2글자 이상)을 근거 원문에서 칠해, 어디서 나온 답인지 눈으로 확인하게 한다.
  // 숫자(+단위, 사이 띄어쓰기 허용)와 3글자 이상 낱말(끝의 조사는 뗌)만 칠한다.
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const pats = [];
  for (const m of answer.matchAll(/(\d+)\s*([가-힣%])?/g)) pats.push(reEsc(m[1]) + (m[2] ? "\\s*" + reEsc(m[2]) : ""));
  const stop = /^(경우|따르면|따라|합니다|입니다|있습니다|규정|인사규정|조에|해당|대상|이상|이내)$/;
  for (let w of answer.match(/[가-힣A-Za-z]{3,}/g) || []) {
    w = w.replace(/(을|를|은|는|이|가|에|의|에는|에서|으로|로)$/, "");
    if (w.length >= 3 && !stop.test(w)) pats.push(reEsc(w));
  }
  let html = esc(text);
  if (pats.length) html = html.replace(new RegExp(`(${[...new Set(pats)].join("|")})`, "g"), "<mark>$1</mark>");
  return html;
}

async function loadStatus(retry = 0) {
  try {
    const r = await fetch(API + "/api/status");
    const s = await r.json();
    $("status").className = "chip " + (s.ollama ? "on" : "off");
    $("status").textContent = s.ollama ? "Ollama 연결됨 · 오프라인 동작" : "Ollama 꺼짐";
    $("docs").innerHTML = s.docs.map((d) => `<li>${esc(d.title)}</li>`).join("");
    const labels = { gpu: "GPU · qwen3.5 9B", "gpu-qwen2.5": "GPU · qwen2.5 7B", cpu: "CPU만 · qwen3.5 4B (사내 PC)", "cpu-4t": "CPU 4스레드 · qwen3.5 4B" };
    $("profile").innerHTML = s.profiles.map((p) =>
      `<option value="${p.name}">${esc(labels[p.name] || p.name + " · " + p.model)}</option>`).join("");
    $("profile").value = localStorage.getItem("profile") || s.default_profile;
  } catch (e) {
    $("status").className = "chip off";
    $("status").textContent = retry < 30 ? "엔진 시작 중…" : "엔진에 연결 못 함";
    if (retry < 30) setTimeout(() => loadStatus(retry + 1), 1000);
  }
}

function render(card, d) {
  const cites = d.citations.map((c) => `
    <details open>
      <summary><b>${esc(c.article)}</b>(${esc(c.title)}) · ${esc(c.doc_title)}</summary>
      <pre>${highlight(c.text, d.answer)}</pre>
    </details>`).join("");
  card.innerHTML = `
    <div class="q">Q. ${esc(d.question)}</div>
    ${d.answerable
      ? `<span class="badge ok">근거 있음</span><p class="answer">${esc(d.answer)}</p>
         <div class="cites"><h3>근거 조문</h3>${cites}</div>`
      : `<span class="badge unknown">모른다</span>
         <p class="answer">제공된 규정에서 근거를 찾을 수 없어 답하지 않았습니다.</p>`}
    <div class="retrieved">검색된 조문: ${d.retrieved.map((r) => esc(r.doc_title.replace(/^\(.*?\)\s*/, "") + " " + r.article)).join(", ")}</div>
    <div class="meta">${esc(d.model)} · 검색 ${d.timing.retrieve_s}초 + 생성 ${d.timing.generate_s}초 = ${d.timing.total_s}초</div>`;
  // 긴 조문은 칠한 곳이 보이도록 그 위치로 스크롤한다.
  card.querySelectorAll("details pre").forEach((pre) => {
    const m = pre.querySelector("mark");
    if (m) pre.scrollTop = m.offsetTop - pre.offsetTop - 40;
  });
}

async function ask(q) {
  q = q.trim();
  if (!q) return;
  $("go").disabled = true;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="q">Q. ${esc(q)}</div><div class="thinking">조문을 찾아 답을 만드는 중</div>`;
  $("out").prepend(card);
  try {
    const r = await fetch(API + "/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, profile: $("profile").value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    render(card, d);
  } catch (e) {
    card.innerHTML = `<div class="q">Q. ${esc(q)}</div><div class="err">오류: ${esc(e.message)}</div>`;
  } finally {
    $("go").disabled = false;
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask($("q").value); }
});
$("profile").addEventListener("change", () => { try { localStorage.setItem("profile", $("profile").value); } catch {} });
$("examples").innerHTML = EXAMPLES.map((q) => `<button type="button">${esc(q.replace(/^.*?(에서|상) /, ""))}</button>`).join("");
[...$("examples").children].forEach((b, i) => b.addEventListener("click", () => { $("q").value = EXAMPLES[i]; ask(EXAMPLES[i]); }));
loadStatus();

// 데모 녹화용: 질문을 한 글자씩 입력하고 답을 기다린다. (앱은 DOCQA_DEMO=1, 브라우저는 ?demo)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.startDemo = async () => {
  const qs = [EXAMPLES[2], EXAMPLES[3]];
  await sleep(1500);
  for (const q of qs) {
    $("q").value = "";
    for (const ch of q) { $("q").value += ch; await sleep(35); }
    await sleep(400);
    await ask($("q").value);
    $("q").value = "";
    await sleep(3500);
  }
  document.title = "demo-done";
};
if (location.search.includes("demo")) window.startDemo();
</script>
</body>
</html>
