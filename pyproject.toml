[project]
name = "local-docqa"
version = "0.1.0"
description = "폐쇄망 문서 Q&A — GPU 없는 PC에서 도는 로컬 RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "psutil>=7.2.2",
]

[project.scripts]
docqa = "docqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docqa"]
